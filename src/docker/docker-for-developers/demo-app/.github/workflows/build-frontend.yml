# Chapter 11 course material, deliberately parked here rather than at the repo root:
# GitHub only runs workflows under the root .github/workflows, so this copy stays inert.
# Move it up a level (and set the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets) to arm it.
name: build-frontend

on:
  push:
    branches:
      - "main"
    paths:
      - 'src/docker/docker-for-developers/demo-app/DockerForDevelopers.DemoApp.Frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src/.
          file: ./src/docker/docker-for-developers/demo-app/DockerForDevelopers.DemoApp.Frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${{github.run_number}}
