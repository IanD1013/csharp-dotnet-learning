# Chapter 11 course material, deliberately parked here rather than at the repo root:
# GitHub only runs workflows under the root .github/workflows, so this copy stays inert.
# Move it up a level (and set the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets) to arm it.
name: build-api

on:
  push:
    branches:
      - "main"
    paths:
      - 'src/docker/docker-for-developers/demo-app/DockerForDevelopers.DemoApp.Api/**'
      - 'src/docker/docker-for-developers/demo-app/DockerForDevelopers.DemoApp.Tests/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # docker-compose.yaml lives here, and the build context is three levels up at src/.
        working-directory: src/docker/docker-for-developers/demo-app
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Spin up database
        run: docker compose up -d database
      -
        name: Seed database
        run: docker compose run --build database-seed
      -
        # --network host is what lets the RUN dotnet test layer reach localhost:1433.
        name: Build
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api:${{github.run_number}} \
            -f DockerForDevelopers.DemoApp.Api/Dockerfile \
            --network host \
            ../../..
      -
        name: Push
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api:${{github.run_number}}
      -
        name: Tear down database
        if: always()
        run: docker compose down database
