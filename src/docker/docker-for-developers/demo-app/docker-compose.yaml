services:

  frontend:
    build:
      context: ../../..
      dockerfile: docker/docker-for-developers/demo-app/DockerForDevelopers.DemoApp.Frontend/Dockerfile
    image: frontend
    container_name: frontend
    ports:
      - 1234:80

  api:
    build:
      context: ../../..
      dockerfile: docker/docker-for-developers/demo-app/DockerForDevelopers.DemoApp.Api/Dockerfile
      # Since chapter 11 the API image runs dotnet test during the build, and those tests
      # talk to localhost:1433. Without the host network the build has no route to the
      # database, so bring database up and seed it before building this service.
      network: host
    image: api
    container_name: api
    ports:
      - 17860:8080

  database:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: database
    environment:
      - ACCEPT_EULA=1
      - MSSQL_SA_PASSWORD=Dometrain#123
    ports:
      - 1433:1433
    volumes:
      - sqldb-data:/var/opt/mssql

  database-seed:
    depends_on: [ database ]
    build:
      context: db/
      dockerfile: Dockerfile
    container_name: database-seed

volumes:
  sqldb-data:
